# Fish Classifier Configuration
# Copy to config.local.yaml for local overrides

# Model
model:
  name: "mobilenet_v3_small"    # mobilenet_v3_small, mobilenet_v3_large, resnet18
  pretrained: true
  dropout: 0.3
  hidden_dim: 512
  input_size: 224

# Training
training:
  data_dir: "dataset"
  model_dir: "models"
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  val_split: 0.2
  num_workers: 4
  seed: 42
  label_smoothing: 0.1
  weight_decay: 0.0001
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0001

# Optimizer & Scheduler
optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  type: "CosineAnnealingWarmRestarts"
  T_0: 5
  T_mult: 2
  eta_min: 1e-6

# Data Augmentation
augmentation:
  random_resized_crop_scale: [0.8, 1.0]
  horizontal_flip_prob: 0.5
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  random_affine:
    translate: [0.1, 0.1]
    scale: [0.9, 1.1]

# Inference
inference:
  top_k: 5
  model_url: "https://huggingface.co/hasnayn453/fish-classifier/resolve/main/fish_classifier.pth"

# Gradio UI
ui:
  host: "127.0.0.1"
  port: 7860
  theme: "soft"
  share: false
  debug: false

# Hugging Face Hub
huggingface:
  repo_id: "hasnayn453/fish-classifier"
  model_filename: "fish_classifier.pth"
  private: false